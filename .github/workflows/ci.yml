name: Protect Me CI
on:
  push:
    branches: [main, feat/medusa-offline-security-v1-1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned Medusa Ed25519 dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - run: npm ci
      - name: Gate + Shield unit tests
        run: npm test
      - name: Medusa unit tests (contract/medusa, pinned cryptography)
        run: python3 -m unittest discover -s contract/medusa -p 'test_*.py' -v
      - name: Medusa manifest integrity and coverage
        run: |
          set -euo pipefail
          cd contract/medusa
          sha256sum --strict -c SHA256SUMS
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          expected = set(subprocess.check_output(['git', 'ls-files', '--', '.'], text=True).splitlines()) - {'SHA256SUMS'}
          listed = [line.split('  ', 1)[1] for line in Path('SHA256SUMS').read_text().splitlines() if line]
          if len(listed) != len(set(listed)) or set(listed) != expected:
              raise SystemExit(f'SHA256SUMS coverage mismatch: missing={sorted(expected - set(listed))}; unexpected={sorted(set(listed) - expected)}')
          PYCODE
      - name: Gate runs on the example map
        run: python3 gate/worlds_gate.py examples/worlds.example.json examples/patches.example.json > /dev/null
      - name: Package contains only the allowlist (no dev state, git data, env files, internal profiles)
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const bad = files.filter(f => /(^|\/)(\.wrangler|\.git|node_modules|profiles)(\/|$)|\.env($|\.)|\.dev\.vars|\.sqlite|\.pem$|\.key$/.test(f));
            console.log(files.length + ' files packed');
            if (bad.length) { console.error('LEAK:', bad); process.exit(1); }
          "
      - name: Preflight gate runs on the example
        run: python3 contract/scripts/preflight.py examples/preflight.example.json --compact
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Shield real-path witness (Playwright through wrangler dev)
        run: npm run e2e
      - name: Production Shield entrypoint smoke test (Playwright through wrangler dev)
        run: npx playwright test --config playwright.production.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          retention-days: 14
