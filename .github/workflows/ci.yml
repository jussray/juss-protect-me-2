name: Protect Me CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Gate + Shield unit tests
        run: npm test
      - name: Gate runs on the example map
        run: python3 gate/worlds_gate.py examples/worlds.example.json examples/patches.example.json > /dev/null
      - name: Package contains only the allowlist (no dev state, git data, env files, internal profiles)
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const bad = files.filter(f => /(^|\/)(\.wrangler|\.git|node_modules|profiles)(\/|$)|\.env($|\.)|\.dev\.vars|\.sqlite|\.pem$|\.key$/.test(f));
            console.log(files.length + ' files packed');
            if (bad.length) { console.error('LEAK:', bad); process.exit(1); }
          "
      - name: Preflight gate runs on the example
        run: python3 contract/scripts/preflight.py examples/preflight.example.json --compact
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Shield real-path witness (Playwright through wrangler dev)
        run: npm run e2e
      - name: Production Shield entrypoint smoke test (Playwright through wrangler dev)
        run: npx playwright test --config playwright.production.config.mjs
      # Retained Playwright evidence is a release gate. An upload failure must
      # fail CI even if the tests passed. Preserve the diagnostic summary below.
      - id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          retention-days: 5
          if-no-files-found: error
      - name: Record missing evidence artifact
        if: always() && steps.evidence.outcome == 'failure'
        run: |
          echo "::warning title=Playwright evidence NOT retained::upload-artifact failed (see step log, e.g. artifact storage quota). Tests ran; the report artifact for ${GITHUB_SHA} is missing."
          {
            echo '### Playwright evidence artifact: NOT RETAINED'
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- The test steps above ran and gated this job; only the report upload failed.'
            echo '- Cause is in the upload step log (commonly: account artifact storage quota).'
          } >> "$GITHUB_STEP_SUMMARY"
