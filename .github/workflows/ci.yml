name: Protect Me CI
on:
  push:
    branches: [main, feat/medusa-offline-security-v1-1, fix/medusa-quote-floor-manifest-20261108]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned Medusa Ed25519 dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - run: npm ci
      - name: Verify complete Medusa manifest and tracked file hashes
        id: manifest
        run: |
          set -euo pipefail
          (cd contract/medusa && sha256sum --strict --check SHA256SUMS)
          actual="$(git ls-files contract/medusa | sed 's#^contract/medusa/##' | grep -v '^SHA256SUMS$' | sort)"
          listed="$(sed -E 's/^[0-9a-f]{64}  //' contract/medusa/SHA256SUMS | sort)"
          test "$actual" = "$listed" || { echo "::error::Medusa manifest file coverage drift"; exit 1; }
      - name: Gate + Shield unit tests
        id: unit
        run: npm test
      - name: Gate runs on the example map
        id: example
        run: python3 gate/worlds_gate.py examples/worlds.example.json examples/patches.example.json > /dev/null
      - name: Package contains only the allowlist (no dev state, git data, env files, internal profiles)
        id: package
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const bad = files.filter(f => /(^|\/)(\.wrangler|\.git|node_modules|profiles)(\/|$)|\.env($|\.)|\.dev\.vars|\.sqlite|\.pem$|\.key$|^docs\/claude\/|^receipts\//.test(f));
            console.log(files.length + ' files packed');
            if (bad.length) { console.error('LEAK:', bad); process.exit(1); }
          "
      - name: Preflight gate runs on the example
        id: preflight
        run: python3 contract/scripts/preflight.py examples/preflight.example.json --compact
      - name: Record Source verification outcomes
        if: always()
        env:
          MANIFEST: ${{ steps.manifest.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          EXAMPLE: ${{ steps.example.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
        run: |
          {
            echo '## Source verification outcomes'
            echo "Exact checkout: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "MANIFEST: $MANIFEST"
            echo "UNIT: $UNIT"
            echo "EXAMPLE: $EXAMPLE"
            echo "PACKAGE: $PACKAGE"
            echo "PREFLIGHT: $PREFLIGHT"
          } >> "$GITHUB_STEP_SUMMARY"
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        id: browser_setup
        run: npx playwright install --with-deps chromium
      - name: Shield real-path witness (Playwright through wrangler dev)
        id: shield_browser
        run: npm run e2e
      - name: Production Shield entrypoint smoke test (Playwright through wrangler dev)
        id: production_browser
        run: npx playwright test --config playwright.production.config.mjs
      - name: Medusa authenticated local browser acceptance
        id: medusa_browser
        run: npx playwright test --config playwright.medusa.config.mjs
      # Report transport is not an acceptance check. Keep all tests fatal.
      - name: Upload browser reports (best-effort transport)
        id: report_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-production-report/
            playwright-medusa-report/
            test-results/
          retention-days: 5
      - name: Record Browser verification outcomes
        if: always()
        env:
          BROWSER_SETUP: ${{ steps.browser_setup.outcome }}
          SHIELD_BROWSER: ${{ steps.shield_browser.outcome }}
          PRODUCTION_BROWSER: ${{ steps.production_browser.outcome }}
          MEDUSA_BROWSER: ${{ steps.medusa_browser.outcome }}
          REPORT_UPLOAD: ${{ steps.report_upload.outcome }}
        run: |
          {
            echo '## Browser verification outcomes'
            echo "Exact checkout: $(git rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "BROWSER_SETUP: $BROWSER_SETUP"
            echo "SHIELD_BROWSER: $SHIELD_BROWSER"
            echo "PRODUCTION_BROWSER: $PRODUCTION_BROWSER"
            echo "MEDUSA_BROWSER: $MEDUSA_BROWSER"
            echo "REPORT_UPLOAD: $REPORT_UPLOAD"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$REPORT_UPLOAD" != success ]; then
            echo '::warning::Browser report delivery unavailable; do not infer browser success from report delivery.'
          fi
  verify:
    needs: [verify-source, verify-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both verification jobs to succeed
        env:
          SOURCE: ${{ needs.verify-source.result }}
          BROWSER: ${{ needs.verify-browser.result }}
        run: |
          set -euo pipefail
          printf 'source=%s browser=%s\n' "$SOURCE" "$BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SOURCE" = success
          test "$BROWSER" = success
